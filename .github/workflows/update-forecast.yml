name: Update Kenya precipitation forecast

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['**/kenya-rain/**', '.github/workflows/update-forecast.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Locate project folder
        run: |
          F=$(find . -name ingest.py -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::ingest.py was not found in the repository. Upload it next to index.html."
            find . -maxdepth 4 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "PROJECT=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Using folder: $(dirname "$F")"
          ls -la "$(dirname "$F")"

      - name: Check required files
        run: |
          for f in index.html styles.css script.js forecast-adapter.js ingest.py; do
            [ -f "$PROJECT/$f" ] || { echo "::error::Missing $PROJECT/$f"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          pip install numpy scipy eccodes ecmwf-opendata

      - name: Ingest open-data forecasts
        env:
          KPE_DATA: data
          KPE_DAYS: '7'
          PYTHONUNBUFFERED: '1'
        run: |
          cd "$PROJECT"
          python ingest.py ecmwf_ifs gfs icon
          ls -la data

      - name: Assemble site
        run: |
          mkdir -p _site
          cp "$PROJECT/index.html" "$PROJECT/styles.css" "$PROJECT/script.js" "$PROJECT/forecast-adapter.js" _site/
          cp -r "$PROJECT/data" _site/data
          ls -R _site
          cat _site/data/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
